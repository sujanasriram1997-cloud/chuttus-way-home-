<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuttu's Way Home ❤️</title>
    <style>
        :root {
            --bg-bright: #fff5f6;
            --card-white: #ffffff;
            --accent-pink: #ff477e;
            --accent-soft: #ffb7c5;
            --track-gray: #cbd5e0;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --kerala-green: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-bright);
            color: var(--text-dark);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin: 15px 0 25px 0;
            background: var(--card-white);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 71, 126, 0.05);
        }

        .header h1 {
            color: var(--accent-pink);
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            font-weight: 800;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .card {
            background: var(--card-white);
            border-radius: 24px;
            padding: 25px 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(255, 71, 126, 0.08);
            border: 1px solid rgba(255, 71, 126, 0.1);
        }

        .card h3 {
            margin: 0 0 15px 0;
            font-size: 1rem;
            color: var(--accent-pink);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .counter-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .counter-number {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--accent-pink);
            line-height: 1;
        }

        .counter-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
            text-align: left;
        }

        .live-status-box {
            background: #fff0f3;
            border-radius: 16px;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 25px;
            border: 1px solid var(--accent-soft);
            transition: all 1s ease;
        }

        .scenic-environment {
            position: relative;
            background: linear-gradient(to bottom, #7bed9f, #a8e6cf);
            padding: 45px 0;
            border-radius: 16px;
            margin: 20px 0;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            transition: all 1s ease;
        }

        .scenery-layer-top, .scenery-layer-bottom {
            position: absolute;
            width: 100%;
            font-size: 1.2rem;
            letter-spacing: 15px;
            opacity: 0.8;
            text-align: center;
            transition: opacity 0.8s ease;
        }
        .scenery-layer-top { top: 8px; }
        .scenery-layer-bottom { bottom: 8px; }

        .kerala-scenery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .kerala-element {
            font-size: 1.6rem;
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .kerala-element span {
            font-size: 0.6rem;
            background: rgba(255,255,255,0.9);
            padding: 2px 4px;
            border-radius: 4px;
            color: #1a1a1a;
            font-weight: bold;
            margin-top: 2px;
            white-space: nowrap;
        }

        .el-palm1 { top: 6px; left: 12%; font-size: 1.8rem; }
        .el-teashop { bottom: 4px; left: 28%; }
        .el-kathakali { top: 4px; right: 32%; }
        .el-home { bottom: 4px; right: 12%; font-size: 1.9rem; }
        .el-palm2 { top: 6px; right: 4%; font-size: 1.8rem; }

        .railway-track {
            height: 12px;
            background: repeating-linear-gradient(90deg, #8c7ae6, #8c7ae6 4px, var(--track-gray) 4px, var(--track-gray) 16px);
            border-top: 3px solid #718096;
            border-bottom: 3px solid #718096;
            position: relative;
            margin: 0 10px;
            z-index: 5;
        }

        .journey-progress-line {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: rgba(255, 71, 126, 0.4);
            width: 0%;
        }

        .avatar-bike-container {
            position: absolute;
            top: -42px;
            left: 0%;
            transform: translateX(-50%);
            transition: left 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .interceptor-badge {
            background: #111111;
            color: #ff9f43;
            font-family: 'Arial Black', sans-serif;
            font-size: 0.65rem;
            font-weight: 900;
            font-style: italic;
            padding: 3px 6px;
            border-radius: 6px;
            border: 2px solid #ff9f43;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .bike-wheels {
            font-size: 0.95rem;
            margin-top: -2px;
            animation: bikeVibrate 0.15s infinite alternate;
        }

        @keyframes bikeVibrate {
            0% { transform: translateY(0); }
            100% { transform: translateY(-2px); }
        }

        .stations-vertical-list {
            text-align: left;
            margin-top: 20px;
            background: #f7fafc;
            border-radius: 16px;
            padding: 15px;
            border: 1px solid #e2e8f0;
        }

        .station-row {
            display: flex;
            align-items: center;
            padding: 12px 5px;
            border-bottom: 1px solid #edf2f7;
            font-weight: 600;
            color: var(--text-muted);
        }

        .station-row:last-child {
            border-bottom: none;
        }

        .station-indicator {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--track-gray);
            margin-right: 15px;
            border: 2px solid #cbd5e0;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .station-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.95rem;
        }

        .station-name {
            color: var(--text-dark);
        }

        .station-row.passed {
            color: #a0aec0;
        }
        .station-row.passed .station-indicator {
            background: #2ed573;
            border-color: #2ed573;
        }

        .station-row.current-active {
            color: var(--accent-pink);
            background: rgba(255, 71, 126, 0.05);
            border-radius: 8px;
        }
        .station-row.current-active .station-indicator {
            background: var(--accent-pink);
            border-color: var(--accent-pink);
            box-shadow: 0 0 8px var(--accent-pink);
        }
        .station-row.current-active .station-name {
            color: var(--accent-pink);
            font-weight: 800;
        }

        .bulletin-textarea {
            width: 90%;
            height: 80px;
            border: 2px dashed var(--accent-soft);
            border-radius: 16px;
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-dark);
            resize: none;
            outline: none;
            background-color: #fffcfc;
            text-align: center;
        }

        .btn {
            background: var(--accent-pink);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(255, 71, 126, 0.2);
            width: 95%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Chuttu's Way Home ❤️</h1>
            <p>Tracking your journey back to me</p>
        </div>

        <div class="card">
            <div class="counter-box">
                <div class="counter-number" id="days-count">0</div>
                <div class="counter-label">Days Together<br><span style="font-size: 0.85rem; font-weight: normal; color: var(--text-muted)">Every milestone matters</span></div>
            </div>
        </div>

        <div class="card">
            <h3>Live Journey Track</h3>
            
            <div class="live-status-box" id="status-panel">
                <span id="live-status-text">Setting up timeline...</span>
            </div>

            <div class="scenic-environment" id="scenic-box">
                <div class="scenery-layer-top" id="generic-top">🌲 🌳 🌿 🌲 🌳</div>
